<script>
addEventListener('DOMContentLoaded',()=>{
const S=2.5;
const mob=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<600;
const {RoundedBoxGeometry,RoomEnvironment}=THREE;
const FALLBACK={name:'Имя',logo:'claude',tag:'Opus 5.5',accessories:[],mood:'happy',bg:'#fbfaf7'};
const q=new URLSearchParams(location.search);
const book=window.AVATARS||{};
const made=k=>String(book[k].made||'');
const keys=Object.keys(book).filter(k=>k.startsWith('glass/')).sort((a,b)=>made(a).localeCompare(made(b)));
const C={...FALLBACK,...book[book[q.get('robot')]?q.get('robot'):keys[keys.length-1]]};
if(q.get('bg'))C.bg=q.get('bg');
const BG='#'+String(C.bg).replace('#','');
const ACC=Array.isArray(C.accessories)?C.accessories:[];
const NAME=String(C.name).slice(0,20);
const TAG=String(C.tag||'').slice(0,12);
document.title='Робот '+NAME;
document.documentElement.style.background=BG;

const M=(g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o};
const rb=(w,h,d,r)=>new RoundedBoxGeometry(w,h,d,mob?3:5,r);
const b=(w,h,d,r)=>rb(w*S,h*S,d*S,r*S);
const glow=c=>new THREE.MeshBasicMaterial({color:c,toneMapped:false});
const tex=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');f(g,w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t};
const mono='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
const rr=(g,x,y,w,h,r)=>{r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
const seeded=s=>{let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};
const ready=()=>{document.documentElement.dataset.ready='1'};

function conform(geo,R,lift){
  const p=geo.attributes.position,hw=.33*S,hh=.29*S,cy=.29*S,r=R*S,f=.26*S,sag=r*(1-Math.cos(Math.PI/4/(mob?3:5)))+lift*S;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),dx=Math.max(0,Math.abs(x)-(hw-r)),dy=Math.max(0,Math.abs(y-cy)-(hh-r)),d=Math.min(Math.hypot(dx,dy),r*.999);
    p.setZ(i,f-(r-Math.sqrt(r*r-d*d))+sag);
  }
  p.needsUpdate=true;geo.computeVertexNormals();
}

function logo(par,key,x,y,r,rot,R){
  const t=tex(512,512,g=>{g.fillStyle='#ffffff';g.beginPath();g.arc(256,256,255,0,7);g.fill()});
  const img=new Image();
  img.onload=()=>{const g=t.image.getContext('2d'),iw=img.naturalWidth||img.width||1,ih=img.naturalHeight||img.height||1,k=.6*512/Math.max(iw,ih);g.drawImage(img,256-iw*k/2,256-ih*k/2,iw*k,ih*k);t.needsUpdate=true;ready()};
  img.onerror=ready;
  img.src=LOGOS[key];
  const geo=new THREE.RingGeometry(0,r*S,64,10);geo.rotateZ(rot);geo.translate(x*S,y*S,0);conform(geo,R,.006);
  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:t,transparent:true,toneMapped:false}));par.add(m);return m;
}

function tag(par,text,x,y,rot,R){
  const w=Math.min(text.length*.037+.06,.47),h=.1,P=2600;
  const t=tex(Math.round(w*P),Math.round(h*P),(g,W,H)=>{
    g.fillStyle='#ffffff';rr(g,0,0,W,H,.022*P);g.fill();
    g.fillStyle='#16161a';let fs=Math.round(.062*P);const F=()=>'700 '+fs+'px '+mono;g.font=F();
    while(g.measureText(text).width>W-.04*P&&fs>40){fs-=4;g.font=F()}
    g.textAlign='center';g.textBaseline='middle';g.fillText(text,W/2,H/2+.003*P);
  });
  const geo=new THREE.PlaneGeometry(w*S,h*S,32,6);geo.rotateZ(rot);geo.translate(x*S,y*S,0);conform(geo,R,.006);
  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:t,transparent:true,toneMapped:false}));par.add(m);return m;
}

function sticker(par,name){
  const W=600,Hh=420;
  const t=tex(W,Hh,(g,w,h)=>{
    g.fillStyle='#e8263a';rr(g,0,0,w,h,40);g.fill();
    g.fillStyle='#fff';g.font='900 92px Helvetica,Arial,sans-serif';g.textAlign='center';g.fillText('HELLO',w/2,100);
    g.font='700 44px Helvetica,Arial,sans-serif';g.fillText('my name is',w/2,152);
    g.fillRect(24,182,w-48,h-212);g.fillStyle='#16161a';
    let fs=130;const F=()=>'700 '+fs+'px "Marker Felt","Comic Sans MS",cursive';g.font=F();
    while(g.measureText(name).width>w-80&&fs>40){fs-=6;g.font=F()}
    g.textBaseline='middle';g.fillText(name,w/2,182+(h-212)/2+6);
  });
  const m=new THREE.Mesh(new THREE.PlaneGeometry(.36*S,.252*S),new THREE.MeshBasicMaterial({map:t,toneMapped:false,transparent:true}));
  m.position.set(0,.19*S,.262*S);m.rotation.z=-.05;par.add(m);
}

function antenna(par,x,y,len,mat,col,r){
  const A=new THREE.Group();A.position.set(x,y,0);par.add(A);
  A.add(M(new THREE.CylinderGeometry(.012*S,.014*S,len*S,10),mat,0,len*S/2,0));
  const bulb=M(new THREE.SphereGeometry(r*S,24,18),glow(col),0,len*S+r*S*.7,0);A.add(bulb);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(r*S*1.9,20,14),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.16,depthWrite:false,toneMapped:false}));bulb.add(halo);
  return {A,bulb,halo,base:bulb.position.clone()};
}

function blinker(a,c,d,dbl){
  let n=1+Math.random()*a;
  return t=>{if(t>n+d){n=Math.random()<dbl?t+d*1.3:t+a+Math.random()*(c-a)}const p=(t-n)/d;return p>0&&p<1?Math.sin(p*Math.PI):0};
}

function frame(o){
  const G=new THREE.Group(),U=new THREE.Group();U.position.y=.19*S;G.add(U);
  [-1,1].forEach(s=>G.add(M(b(.2,.12,.3,o.footR??.05),o.foot||o.body,s*.15*S,.06*S,.02*S)));
  U.add(M(b(.66,.58,.52,o.torsoR??.18),o.body,0,.29*S,0));
  const arm=s=>{const g=new THREE.Group();g.position.set(s*.38*S,.45*S,0);g.add(M(b(.12,.34,.14,o.armR??.05),o.body,0,-.15*S,0));U.add(g);return g};
  const la=arm(-1),ra=arm(1);
  const H=new THREE.Group();H.position.y=.646*S;U.add(H);
  return {G,U,H,la,ra};
}

function build(who,HN){
  const glass=new THREE.MeshPhysicalMaterial({color:0xd4f1ff,roughness:.06,metalness:0,transmission:1,thickness:.5,ior:1.4,clearcoat:1,clearcoatRoughness:.04,attenuationColor:0x9fd6f0,attenuationDistance:2.5});
  const frost=new THREE.MeshPhysicalMaterial({color:0x7fb4cf,roughness:.35,transmission:.7,thickness:.4,ior:1.4});
  const {G,U,H,la,ra}=frame({body:glass,foot:frost,torsoR:.14,footR:.05,armR:.05});
  const rnd=seeded(who);
  const boardT=tex(512,512,(g,w,h)=>{
    g.fillStyle='#0f2a40';g.fillRect(0,0,w,h);g.strokeStyle='#4fd8ff';g.lineWidth=3;
    for(let i=0;i<34;i++){
      let x=rnd()*w,y=rnd()*h;g.globalAlpha=.35+rnd()*.5;g.beginPath();g.moveTo(x,y);
      for(let k=0;k<4;k++){if(rnd()<.5)x+=(rnd()-.5)*200;else y+=(rnd()-.5)*200;g.lineTo(x,y)}
      g.stroke();g.fillStyle='#8ff0ff';g.beginPath();g.arc(x,y,5,0,7);g.fill();
    }
    g.globalAlpha=1;
  });
  const boardM=new THREE.MeshStandardMaterial({map:boardT,emissiveMap:boardT,emissive:0xffffff,emissiveIntensity:.45,roughness:.6,side:THREE.DoubleSide});

  fan.add(M(new THREE.CylinderGeometry(.08*S,.08*S,.03*S,24,1,true),new THREE.MeshStandardMaterial({color:0x2a2e35,roughness:.5,side:THREE.DoubleSide}),0,.015*S,0));

  const ant=antenna(H,.1*S,domeY(.1*S)-.01*S,.16,glow(0xff1493),0xff1493,.05);ant.A.rotation.z=-.2;

function wear(B,list,capColor){
  const H=B.H;
  const dark=new THREE.MeshStandardMaterial({color:0x22252b,roughness:.5});
  const paint=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7});
  if(!list.includes('phones'))B.hp.visible=false;
  const back=list.includes('cap-back'),front=!back&&list.includes('cap');
  if(front||back){
    const top=new THREE.Color(capColor||(front?0x8a2a2a:0x2b2f38));
    const brim=capColor?top.clone().multiplyScalar(.88):new THREE.Color(front?0x7a2222:0x2b2f38);
    const c=new THREE.Group();
    const dome=new THREE.Mesh(new THREE.SphereGeometry(.4*S,32,16,0,Math.PI*2,0,Math.PI/2),paint(top));dome.scale.y=.75;c.add(dome);
    const visor=new THREE.Mesh(new THREE.BoxGeometry(.5*S,.03*S,.32*S),paint(brim));visor.position.set(0,0,.42*S);c.add(visor);
    c.position.y=.66-.275*S+.3*S;if(back)c.rotation.y=Math.PI;H.add(c);B.ant.A.visible=false;
  }
  if(list.includes('glasses')){
    const gm=new THREE.MeshStandardMaterial({color:0x111111,roughness:.3});
    [-1,1].forEach(s=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.085*S,.012*S,8,24),gm);r.position.set(s*.1*S,.66-.08*S,.25*S);H.add(r)});
    const br=new THREE.Mesh(new THREE.BoxGeometry(.05*S,.012*S,.012*S),gm);br.position.set(0,.66-.06*S,.25*S);H.add(br);
  }
  if(list.includes('mic')){
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(.008*S,.008*S,.32*S,8),dark);arm.rotation.z=Math.PI/2.4;arm.position.set(-.3*S,.66-.2*S,.2*S);H.add(arm);
    const cap=new THREE.Mesh(new THREE.SphereGeometry(.03*S,12,10),dark);cap.position.set(-.16*S,.66-.26*S,.24*S);H.add(cap);
  }
  if(list.includes('earbud')){
    const e=new THREE.Mesh(new THREE.SphereGeometry(.045*S,14,12),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.2}));e.position.set(.37*S,.66-.1*S,.02*S);H.add(e);
  }
}

let R;

R.setPixelRatio(Math.min(devicePixelRatio||1,1.5));

const cam=new THREE.PerspectiveCamera(30,1,.1,100);

let px=0,py=0,seen=-99,waveUntil=0,t=0;
addEventListener('pointermove',e=>{px=e.clientX/innerWidth*2-1;py=e.clientY/innerHeight*2-1;seen=t});
addEventListener('pointerdown',()=>{waveUntil=t+2.4});
const clock=new THREE.Clock();
const tn=Math.tan(THREE.MathUtils.degToRad(15));
R.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05);t+=dt;
  const talk=C.mood==='talk';
  const idle={x:-.08+Math.sin(t*.4)*.1,y:Math.sin(t*.3)*.3};
  const gaze=talk?{x:Math.sin(t*1.1)*.18,y:Math.sin(t*.7)*.3}:C.mood==='think'?{x:.35,y:-.35}:t-seen<5?{x:-py*.8,y:px*.5}:idle;

  const a=innerWidth/innerHeight,d=Math.max(2.45/tn,1.75/(tn*a));
  cam.aspect=a;cam.position.set(0,2.3,d);cam.lookAt(0,1.95,0);cam.updateProjectionMatrix();
  R.render(scene,cam);
});
});
